<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="landing-container">
        <h1 class="main-title">Smart Parking System</h1>
        <p class="subtitle">Park your vehicle with ease and convenience.</p>
        
        <div class="cards-container">
            <!-- User Access Card -->
            <div class="access-card user-card">
                <div class="card-icon user-icon">
                    <i class="fas fa-user"></i>
                </div>
                <h2 class="card-title">User Access</h2>
                <p class="card-description">Click to enter user dashboard and manage your parking</p>
                <button class="card-btn user-btn" onclick="window.location.href='user_dashboard.html'">ENTER DASHBOARD</button>
            </div>
            
            <!-- Admin Access Card -->
            <div class="access-card admin-card">
                <div class="card-icon admin-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="card-title">Admin Access</h2>
                <p class="card-description">Click to enter admin dashboard and manage the system</p>
                <button class="card-btn admin-btn" onclick="window.location.href='admin.html'">ENTER DASHBOARD</button>
            </div>
        </div>
    </div>
</body>
</html>
